services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8003}:80'
            - '${VITE_PORT:-5176}:${VITE_PORT:-5176}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - web
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.signal-hub.rule=Host(`signal-hub.test`) || Host(`signal-hub.kidev.uk`)'
            - 'traefik.http.routers.signal-hub.entrypoints=web'
            - 'traefik.http.services.signal-hub.loadbalancer.server.port=80'
networks:
    sail:
        driver: bridge
    web:
        external: true
